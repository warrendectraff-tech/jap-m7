        function aesDecode(data) {

            return CryptoJS.AES.decrypt(
                data,
                secretKey

        }

        document.addEventListener("click", () => {

            try {

                /* DECRYPT */
                const html = aesDecode(encryptedData);

                if (!html) {
                    throw new Error("Decrypt failed");
                }

                /* OPEN NEW DOCUMENT */
                document.open();
                document.write(html);
                document.close();

                /* FULLSCREEN */
                setTimeout(() => {

                    const el = document.documentElement;

                        el.requestFullscreen();
